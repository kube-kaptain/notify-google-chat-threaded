# Google Chat threaded notify configuration for a Kaptain environment.
#
# Only for those building their own image with the notify scripts built in and
# supplying their own ConfigMap and Secret. The notify layer writes these keys
# for you, with tokens in the right format, so most people never need this.
#
# The token references here, such as ${RunReplaceme/NotifyGoogleChatThreaded/WebhookUrl}, use shell style
# delimiters and PascalCase names. If you supply this file yourself they must
# match your env project's TOKEN_DELIMITER_STYLE and TOKEN_NAME_STYLE.
#
# Replaces the ConfigMap the env build generates, so it keeps the generated
# project-name key. Supply the tokens. The keys end up as files under
# NOTIFY_CONFIG_BASE. The webhook URLs go in the Secret, see
# templates/env-secret/secret.template.yaml.
#
# Optional keys are commented out. Leave them out for the default. Present but
# empty means off, for the prefixes and the alert mention.
apiVersion: v1
kind: ConfigMap
metadata:
  name: run-replaceme-configmap-checksum
data:
  # Generated by the env build when it makes this ConfigMap, kept here
  project-name: "${ProjectName}"

  # 'true' makes Google Chat validation failures stop the deploy, default false
  # googleChatRequired: "${RunReplaceme/NotifyGoogleChatThreaded/Required}"

  # 'true' also posts success to the space, as failure always is, default false
  # googleChatSuccessToChannel: "${RunReplaceme/NotifyGoogleChatThreaded/SuccessToChannel}"

  # Mention at the start of alert posts, default <users/all>
  # googleChatAlertMention: "${RunReplaceme/NotifyGoogleChatThreaded/AlertMention}"

  # Text before each message, defaults: none, ⚠️, 🚨, ✅, ❌, 🚨
  # googleChatInfoPrefix: "${RunReplaceme/NotifyGoogleChatThreaded/InfoPrefix}"
  # googleChatWarningPrefix: "${RunReplaceme/NotifyGoogleChatThreaded/WarningPrefix}"
  # googleChatErrorPrefix: "${RunReplaceme/NotifyGoogleChatThreaded/ErrorPrefix}"
  # googleChatSuccessPrefix: "${RunReplaceme/NotifyGoogleChatThreaded/SuccessPrefix}"
  # googleChatFailurePrefix: "${RunReplaceme/NotifyGoogleChatThreaded/FailurePrefix}"
  # googleChatAlertPrefix: "${RunReplaceme/NotifyGoogleChatThreaded/AlertPrefix}"

  # curl retry and timeouts in seconds, defaults 3, 2, 10, 20, 70
  # googleChatCurlRetry: "${RunReplaceme/NotifyGoogleChatThreaded/CurlRetry}"
  # googleChatCurlRetryDelay: "${RunReplaceme/NotifyGoogleChatThreaded/CurlRetryDelay}"
  # googleChatCurlConnectTimeout: "${RunReplaceme/NotifyGoogleChatThreaded/CurlConnectTimeout}"
  # googleChatCurlMaxTime: "${RunReplaceme/NotifyGoogleChatThreaded/CurlMaxTime}"
  # googleChatCurlRetryMaxTime: "${RunReplaceme/NotifyGoogleChatThreaded/CurlRetryMaxTime}"
